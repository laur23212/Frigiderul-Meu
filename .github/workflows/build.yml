name: Compilează APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Teste
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilează APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Redenumește APK
        run: cp app/build/outputs/apk/release/app-release.apk FrigiderulMeu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrigiderulMeu-apk
          path: FrigiderulMeu.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapoarte-teste
          path: app/build/reports/tests/
