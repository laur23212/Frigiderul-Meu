name: Compilează APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Teste
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilează APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Redenumește APK
        run: cp app/build/outputs/apk/release/app-release.apk FrigiderulMeu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrigiderulMeu-apk
          path: FrigiderulMeu.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapoarte-teste
          path: app/build/reports/tests/

      # Publică APK-ul ca „Release" public, ca Obtainium să poată actualiza aplicația automat.
      - name: Publică Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-${{ github.run_number }}" FrigiderulMeu.apk \
            --title "Frigiderul Meu build ${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" \
            --latest
